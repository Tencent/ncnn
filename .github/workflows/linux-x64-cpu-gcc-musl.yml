name: linux-x64-cpu-gcc-musl
on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/linux-x64-cpu-gcc-musl.yml'
    - 'toolchains/host-c.gcc.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/x86/**'
    - 'tests/**'
    - 'tools/**'
    - '!tools/pnnx/**'
    - 'examples/**'
    - 'benchmark/**'
    - '!benchmark/README.md'
  pull_request:
    branches: [master]
    paths:
    - '.github/workflows/linux-x64-cpu-gcc-musl.yml'
    - 'toolchains/host-c.gcc.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/x86/**'
    - 'tests/**'
    - 'tools/**'
    - '!tools/pnnx/**'
    - 'examples/**'
    - 'benchmark/**'
    - '!benchmark/README.md'
concurrency:
  group: linux-x64-cpu-gcc-musl-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  linux-gcc-musl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: build and test with musl
      run: |
        docker run --rm --volume "$GITHUB_WORKSPACE:/src:ro" alpine:3.24 sh -ec '
          apk add --no-cache cmake make gcc g++ libc-dev linux-headers
          cmake -S /src -B /build -DNCNN_BUILD_TESTS=ON
          cmake --build /build -j "$(nproc)"
          ctest --test-dir /build --output-on-failure -j "$(nproc)"
        '
    - name: build-shared
      run: |
        mkdir build-shared && cd build-shared
        cmake -DNCNN_SHARED_LIB=ON ..
        cmake --build . -j $(nproc)
