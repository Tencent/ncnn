name: linux-x64-cpu-gcc-musl
on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/linux-x64-cpu-gcc-musl.yml'
    - 'toolchains/host-c.gcc.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/x86/**'
    - 'tests/**'
    - 'tools/**'
    - '!tools/pnnx/**'
    - 'examples/**'
    - 'benchmark/**'
    - '!benchmark/README.md'
  pull_request:
    branches: [master]
    paths:
    - '.github/workflows/linux-x64-cpu-gcc-musl.yml'
    - 'toolchains/host-c.gcc.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/x86/**'
    - 'tests/**'
    - 'tools/**'
    - '!tools/pnnx/**'
    - 'examples/**'
    - 'benchmark/**'
    - '!benchmark/README.md'
concurrency:
  group: linux-x64-cpu-gcc-musl-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  linux-gcc-musl:
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
    - name: install dependencies
      run: apk add --no-cache git cmake make gcc g++ libc-dev linux-headers
    - uses: actions/checkout@v7
    - name: build
      run: |
        cmake -S . -B build -DNCNN_BUILD_TESTS=ON
        cmake --build build -j "$(nproc)"
    - name: test
      run: ctest --test-dir build --output-on-failure -j "$(nproc)"
    - name: build-shared
      run: |
        cmake -S . -B build-shared -DNCNN_SHARED_LIB=ON
        cmake --build build-shared -j "$(nproc)"
