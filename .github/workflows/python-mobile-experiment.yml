name: python-mobile-experiment
on:
  push:
    branches: [release-ubuntu2604-vs2026-python]
    paths:
    - '.github/workflows/python-mobile-experiment.yml'
    - '.github/workflows/release-python.yml'
    - 'setup.py'
    - 'pyproject.toml'
    - 'python/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-mobile-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.0.app/Contents/Developer
  CIBW_SKIP: "cp3??t-*"

# validate mobile wheels without publishing or creating a release
jobs:
  build_wheels_android:
    if: github.repository == 'nihui/ncnn'
    permissions:
      contents: read
    name: ${{ matrix.arch }} ${{ matrix.build_cp }} on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build_cp: [cp313, cp314, cp315]
        arch: [arm64_v8a, x86_64]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    # ubuntu's android sdk and cibuildwheel provision the matching ndk and
    # gradle-managed emulator. keep cibuildwheel's generated toolchain file
    - name: Build Android wheel and test native architecture
      uses: pypa/cibuildwheel@v4.3.1
      with:
        package-dir: .
        output-dir: wheelhouse
      env:
        CIBW_PLATFORM: android
        CIBW_ARCHS_ANDROID: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.build_cp }}-android_*
        CIBW_BUILD_FRONTEND: build
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ENVIRONMENT_ANDROID: >-
          CMAKE_BUILD_PARALLEL_LEVEL=4
          EXTRA_CMAKE_ARGS="-DNCNN_VULKAN=OFF -DNCNN_OPENMP=OFF"
        # test the native binding without installing runtime dependencies
        # this only changes the disposable test venv, not wheel metadata
        CIBW_BEFORE_TEST_ANDROID: python -m pip config --site set install.no-deps true
        CIBW_TEST_SOURCES: python/ci/mobile_smoke.py
        CIBW_TEST_COMMAND: python -m unittest discover -s python/ci -p mobile_smoke.py -v
        # ubuntu x86_64 can emulator-test x86_64 only. arm64 remains build-only
        CIBW_TEST_SKIP: '*-android_arm64_v8a'
    - uses: actions/upload-artifact@v7
      with:
        name: wheels_android-${{ matrix.build_cp }}-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  build_wheels_ios:
    if: github.repository == 'nihui/ncnn'
    permissions:
      contents: read
    name: ${{ matrix.arch }} ${{ matrix.build_cp }} on iOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build_cp: [cp313, cp314, cp315]
        arch: [arm64_iphoneos, arm64_iphonesimulator, x86_64_iphonesimulator]
        include:
          - { os: macos-15, arch: arm64_iphoneos }
          - { os: macos-15, arch: arm64_iphonesimulator }
          - { os: macos-15-intel, arch: x86_64_iphonesimulator }
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install host cross-build tools
      run: |
        python -m pip install 'cmake>=4,<5' ninja
        cmake --version
        xcodebuild -version
        xcodebuild -showsdks
        xcrun simctl list devices available
    - name: Build iOS wheel and test native simulator
      uses: pypa/cibuildwheel@v4.3.1
      with:
        package-dir: .
        output-dir: wheelhouse
      env:
        CIBW_PLATFORM: ios
        CIBW_ARCHS_IOS: ${{ matrix.arch }}
        # cross sysconfig may report ios13 despite the deployment target override
        CIBW_CONFIG_SETTINGS_IOS: --build-option=--plat-name=ios_14_0_${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.build_cp }}-ios_*
        CIBW_BUILD_FRONTEND: build
        CIBW_BUILD_VERBOSITY: 1
        CIBW_XBUILD_TOOLS_IOS: cmake ninja
        CIBW_ENVIRONMENT_IOS: >-
          CMAKE_BUILD_PARALLEL_LEVEL=4
          CMAKE_GENERATOR=Ninja
          CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.ci-ios/toolchain.cmake"
          IPHONEOS_DEPLOYMENT_TARGET=14.0
          EXTRA_CMAKE_ARGS="-DNCNN_VULKAN=OFF -DNCNN_OPENMP=OFF"
        CIBW_BEFORE_BUILD_IOS: python {project}/python/ci/prepare_ios.py "$CMAKE_TOOLCHAIN_FILE"
        # test the native binding without installing runtime dependencies
        # this only changes the disposable testbed, not wheel metadata
        CIBW_TEST_ENVIRONMENT_IOS: PIP_NO_DEPS=1
        CIBW_TEST_SOURCES: python/ci/mobile_smoke.py
        CIBW_TEST_COMMAND: python -m unittest discover -s python/ci -p mobile_smoke.py -v
        # cibuildwheel can test only native simulators, never physical devices
        CIBW_TEST_SKIP: '*-ios_arm64_iphoneos'
    - name: Inspect wheel target and linked libraries
      env:
        EXPECTED_ARCH: ${{ matrix.arch }}
        EXPECTED_PYTHON: ${{ matrix.build_cp }}
      run: python python/ci/inspect_ios_wheel.py wheelhouse
    - uses: actions/upload-artifact@v7
      with:
        name: wheels_ios-${{ matrix.build_cp }}-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error

