name: python-mobile-experiment
on:
  push:
    branches: [release-ubuntu2604-vs2026-python]
    paths:
    - '.github/workflows/python-mobile-experiment.yml'
    - 'setup.py'
    - 'pyproject.toml'
    - 'python/**'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-mobile-experiment-${{ github.ref }}
  cancel-in-progress: true

# experimental artifacts only. this workflow never creates releases or publishes
# to a package index, and does not change the desktop release wheel matrix
jobs:
  android:
    if: github.repository == 'nihui/ncnn'
    name: Android CP314 CPU (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64_v8a, x86_64]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    # ubuntu's android sdk and cibuildwheel provision the matching ndk and
    # gradle-managed emulator. keep cibuildwheel's generated toolchain file
    - name: Build Android wheel and test native architecture
      uses: pypa/cibuildwheel@v4.3.1
      with:
        package-dir: .
        output-dir: wheelhouse
      env:
        CIBW_PLATFORM: android
        CIBW_ARCHS_ANDROID: ${{ matrix.arch }}
        CIBW_BUILD: cp314-android_*
        CIBW_BUILD_FRONTEND: build
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ENVIRONMENT_ANDROID: >-
          CMAKE_BUILD_PARALLEL_LEVEL=4
          EXTRA_CMAKE_ARGS="-DNCNN_VULKAN=OFF -DNCNN_OPENMP=OFF"
        # cp314 numpy/opencv target wheels are not currently available on pypi
        # this changes only the ephemeral test venv, after build dependencies
        # are installed. it does not alter wheel metadata or release installs
        CIBW_BEFORE_TEST_ANDROID: python -m pip config --site set install.no-deps true
        CIBW_TEST_SOURCES: python/ci/mobile_smoke.py
        CIBW_TEST_COMMAND: python -m unittest discover -s python/ci -p mobile_smoke.py -v
        # ubuntu x86_64 can emulator-test x86_64 only. arm64 remains build-only
        CIBW_TEST_SKIP: '*-android_arm64_v8a'
    - uses: actions/upload-artifact@v7
      with:
        name: experimental-android-cp314-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error
  ios:
    if: github.repository == 'nihui/ncnn'
    name: iOS CP314 CPU (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-15, arch: arm64_iphoneos }
        - { os: macos-15, arch: arm64_iphonesimulator }
        - { os: macos-15-intel, arch: x86_64_iphonesimulator }
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install host cross-build tools
      run: |
        python -m pip install 'cmake>=4,<5' ninja
        cmake --version
        xcodebuild -version
        xcodebuild -showsdks
        xcrun simctl list devices available
    - name: Build iOS wheel and test native simulator
      uses: pypa/cibuildwheel@v4.3.1
      with:
        package-dir: .
        output-dir: wheelhouse
      env:
        CIBW_PLATFORM: ios
        CIBW_ARCHS_IOS: ${{ matrix.arch }}
        CIBW_BUILD: cp314-ios_*
        CIBW_BUILD_FRONTEND: build
        CIBW_BUILD_VERBOSITY: 1
        CIBW_XBUILD_TOOLS_IOS: cmake ninja
        CIBW_ENVIRONMENT_IOS: >-
          CMAKE_BUILD_PARALLEL_LEVEL=4
          CMAKE_GENERATOR=Ninja
          CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.ci-ios/toolchain.cmake"
          IPHONEOS_DEPLOYMENT_TARGET=13.0
          EXTRA_CMAKE_ARGS="-DNCNN_VULKAN=OFF -DNCNN_OPENMP=OFF"
        CIBW_BEFORE_BUILD_IOS: python {project}/python/ci/prepare_ios.py "$CMAKE_TOOLCHAIN_FILE"
        # test the native binding independently of unavailable pypi ios numpy
        # wheels. this affects only installation into the disposable testbed;
        # wheel dependency metadata remains unchanged
        CIBW_TEST_ENVIRONMENT_IOS: PIP_NO_DEPS=1
        CIBW_TEST_SOURCES: python/ci/mobile_smoke.py
        CIBW_TEST_COMMAND: python -m unittest discover -s python/ci -p mobile_smoke.py -v
        # cibuildwheel can test only native simulators, never physical devices
        CIBW_TEST_SKIP: '*-ios_arm64_iphoneos'
    - name: Inspect wheel target and linked libraries
      env:
        EXPECTED_ARCH: ${{ matrix.arch }}
      run: python python/ci/inspect_ios_wheel.py wheelhouse
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: experimental-ios-cp314-${{ matrix.arch }}
        path: |
          wheelhouse/*.whl
          .ci-ios/*.json
        if-no-files-found: warn
