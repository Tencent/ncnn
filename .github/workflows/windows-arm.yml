name: windows-arm
on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/windows-arm.yml'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/arm/**'
    - 'src/layer/vulkan/**'
    - 'tests/**'
    - 'glslang'
  pull_request:
    branches: [master]
    paths:
    - '.github/workflows/windows-arm.yml'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/arm/**'
    - 'src/layer/vulkan/**'
    - 'tests/**'
    - 'glslang'
concurrency:
  group: windows-arm-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.vs-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vs-version: vs2019
            os: windows-2022
            toolset-version: v142
            windows-sdk-version: 22621

          - vs-version: vs2022
            os: windows-2022
            toolset-version: v143
            windows-sdk-version: 26100

          - vs-version: vs2026
            os: windows-2025-vs2026
            toolset-version: v145
            windows-sdk-version: 26100

    env:
      UseMultiToolTask: true
      NCNN_CMAKE_OPTIONS: -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_VULKAN=ON

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
      with:
        sdk-version: ${{ matrix.windows-sdk-version }}
    - name: arm64
      run: |
        mkdir build-arm64; cd build-arm64
        cmake -T ${{ matrix.toolset-version }},host=x64 -A arm64,version=10.0.${{ matrix.windows-sdk-version }}.0 ${{ env.NCNN_CMAKE_OPTIONS }} ..
        cmake --build . --config Release -j 4
    - name: arm64-shared
      run: |
        mkdir build-arm64-shared; cd build-arm64-shared
        cmake -T ${{ matrix.toolset-version }},host=x64 -A arm64,version=10.0.${{ matrix.windows-sdk-version }}.0 ${{ env.NCNN_CMAKE_OPTIONS }} -DNCNN_SHARED_LIB=ON ..
        cmake --build . --config Release -j 4

  windows-arm:
    name: vs2026-arm64-native
    runs-on: windows-11-vs2026-arm
    env:
      UseMultiToolTask: true

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: build
      run: |
        mkdir build; cd build
        cmake -G "Visual Studio 18 2026" -A arm64 -T v145 -DNCNN_BUILD_TESTS=ON -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_VULKAN=OFF -DNCNN_ARM82=OFF ..
        cmake --build . --config Release -j 4
    - name: test
      run: cd build; ctest -C Release --output-on-failure -j 4
