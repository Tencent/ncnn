name: webgpu

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/webgpu.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "cmake/**"
      - "dawn"
      - "src/**"
      - "tests/**"
      - "tools/webgpu/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/webgpu.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "cmake/**"
      - "dawn"
      - "src/**"
      - "tests/**"
      - "tools/webgpu/**"
  workflow_dispatch:

concurrency:
  group: webgpu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      LDFLAGS: -sERROR_ON_WASM_CHANGES_AFTER_LINK -sWASM_BIGINT -O1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Read frozen versions
        id: versions
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          values = {}
          pattern = re.compile(r'^set\((VKWEBGPU_[A-Z0-9_]+) "([^"]+)"\)$')
          for line in Path("cmake/vkwebgpu_versions.cmake").read_text(encoding="utf-8").splitlines():
              match = pattern.match(line)
              if match:
                  values[match.group(1)] = match.group(2)

          outputs = {
              "chrome_sha256": values["VKWEBGPU_CHROME_LINUX_SHA256"],
              "chrome_url": values["VKWEBGPU_CHROME_LINUX_URL"],
              "dawn": values["VKWEBGPU_DAWN_COMMIT"],
              "deps": values["VKWEBGPU_DAWN_DEPS_SHA256"],
              "emsdk": values["VKWEBGPU_EMSDK_VERSION"],
              "node": values["VKWEBGPU_NODE_VERSION"],
              "port": values["VKWEBGPU_EMDAWNWEBGPU_PORT_FILENAME"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in outputs.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Initialize source dependencies
        run: git submodule update --init glslang dawn

      - name: Install frozen emsdk
        run: |
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install "${{ steps.versions.outputs.emsdk }}"
          ./emsdk/emsdk activate "${{ steps.versions.outputs.emsdk }}"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: tests/webgpu/package-lock.json

      - uses: actions/cache@v6
        with:
          path: |
            dawn/third_party
            emsdk/upstream/emscripten/cache
          key: webgpu-${{ runner.os }}-${{ steps.versions.outputs.dawn }}-${{ steps.versions.outputs.deps }}-${{ steps.versions.outputs.emsdk }}

      - name: Bootstrap frozen dependencies
        run: |
          python3 tools/webgpu/bootstrap_dawn.py
          source emsdk/emsdk_env.sh
          printf 'int main() { return 0; }\n' > "$RUNNER_TEMP/port-warmup.cpp"
          em++ "$RUNNER_TEMP/port-warmup.cpp" \
            "--use-port=$PWD/cmake/ports/${{ steps.versions.outputs.port }}:cpp_bindings=false" \
            -sASYNCIFY=1 -o "$RUNNER_TEMP/port-warmup.mjs"
          npm ci --prefix tests/webgpu

      - name: Install frozen Chrome for Testing
        run: |
          curl --fail --location --retry 3 \
            "${{ steps.versions.outputs.chrome_url }}" \
            --output "$RUNNER_TEMP/chrome-linux64.zip"
          echo "${{ steps.versions.outputs.chrome_sha256 }}  $RUNNER_TEMP/chrome-linux64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP"
          echo "NCNN_TEST_CHROME=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Configure WebGPU
        run: |
          source emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm-webgpu \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=ON \
            -DNCNN_BUILD_TESTS=ON \
            -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_OPENMP=OFF \
            "-DNCNN_TEST_CHROME=$NCNN_TEST_CHROME"

      - name: Build WebGPU tests
        run: |
          cmake --build build-wasm-webgpu \
            --target test_vkwebgpu_compute test_absval test_command \
              test_binaryop test_reduction test_squeezenet \
            --parallel 4

      - name: Run WebGPU tests
        run: |
          set -o pipefail
          ctest --test-dir build-wasm-webgpu \
            -R '^(test_vkwebgpu_compute|test_absval|test_command|test_binaryop|test_reduction|test_squeezenet)$' \
            --output-on-failure 2>&1 | tee build-wasm-webgpu/webgpu-test.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webgpu-browser
          path: build-wasm-webgpu/webgpu-test.log
          if-no-files-found: warn
