name: linux-riscv64
on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/linux-riscv64.yml'
    - 'toolchains/riscv64-linux-gnu.toolchain.cmake'
    - 'toolchains/riscv64-unknown-linux-gnu.toolchain.cmake'
    - 'toolchains/riscv64-unknown-linux-gnu.llvm-toolchain.cmake'
    - 'toolchains/c906-v310.toolchain.cmake'
    - 'toolchains/c908-v310.toolchain.cmake'
    - 'toolchains/c910-v310.toolchain.cmake'
    - 'toolchains/k1.toolchain.cmake'
    - 'toolchains/k1.llvm.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/riscv/**'
    - 'tests/**'
    - 'examples/**'
    - 'benchmark/**'
    - '!benchmark/README.md'
  pull_request:
    branches: [master]
    paths:
    - '.github/workflows/linux-riscv64.yml'
    - 'toolchains/riscv64-linux-gnu.toolchain.cmake'
    - 'toolchains/riscv64-unknown-linux-gnu.toolchain.cmake'
    - 'toolchains/riscv64-unknown-linux-gnu.llvm-toolchain.cmake'
    - 'toolchains/c906-v310.toolchain.cmake'
    - 'toolchains/c908-v310.toolchain.cmake'
    - 'toolchains/c910-v310.toolchain.cmake'
    - 'toolchains/k1.toolchain.cmake'
    - 'toolchains/k1.llvm.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/riscv/**'
    - 'tests/**'
    - 'examples/**'
    - 'benchmark/**'
    - '!benchmark/README.md'
concurrency:
  group: linux-riscv64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  gcc-riscv64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: cache-qemu
      id: cache-qemu
      uses: actions/cache@v6
      with:
        path: qemu-install
        key: qemu-riscv64-install-20220502-4
    - name: install-qemu-build-deps
      if: steps.cache-qemu.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install autoconf automake autotools-dev ninja-build build-essential pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev python3
    - name: checkout-qemu
      if: steps.cache-qemu.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: qemu/qemu
        path: qemu
        ref: f5643914a9e8f79c606a76e6a9d7ea82a3fc3e65
    - name: qemu
      if: steps.cache-qemu.outputs.cache-hit != 'true'
      run: |
        cd qemu
        wget https://raw.githubusercontent.com/nihui/ncnn-assets/master/qemu-patches/0007-linux-user-Expose-risc-v-V-isa-bit-in-get_elf_hwcap.patch
        patch -p1 -i 0007-linux-user-Expose-risc-v-V-isa-bit-in-get_elf_hwcap.patch
        ./configure --prefix=$GITHUB_WORKSPACE/qemu-install --target-list=riscv64-linux-user --disable-system
        make -j$(nproc)
        make install

    - name: riscv64-gnu-toolchain
      run: |
        sudo apt-get update
        sudo apt-get install g++-riscv64-linux-gnu

    - name: configure
      run: mkdir build && cd build && cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/riscv64-linux-gnu.toolchain.cmake -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_TESTS=ON ..
    - name: build
      run: cmake --build build -j $(nproc)

    - name: test
      run: |
        export PATH=$GITHUB_WORKSPACE/qemu-install/bin:$PATH
        cd build
        TESTS_EXECUTABLE_LOADER=qemu-riscv64 TESTS_EXECUTABLE_LOADER_ARGUMENTS="-L;/usr/riscv64-linux-gnu" ctest --output-on-failure -j $(nproc)

  xuantie:
    name: xuantie-${{ matrix.cpu }}
    runs-on: [self-hosted, linux, ubuntu]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cpu: c906, QEMU_CPU: c906fdv, OPENMP: OFF, RVV: OFF, XTHEADVECTOR: ON,  ZFH: ON, ZVFH: OFF }
          - { cpu: c910, QEMU_CPU: c910v,   OPENMP: ON,  RVV: OFF, XTHEADVECTOR: ON,  ZFH: ON, ZVFH: OFF }
          - { cpu: c908, QEMU_CPU: c908v,   OPENMP: ON,  RVV: ON,  XTHEADVECTOR: OFF, ZFH: ON, ZVFH: ON  }
          - { cpu: c907, QEMU_CPU: c907fdv-rv64,   OPENMP: ON,  RVV: ON,  XTHEADVECTOR: OFF, ZFH: ON, ZVFH: ON  }

    steps:
    - uses: actions/checkout@v7

    # Temporary standalone emulator diagnostic; defer failure until after ctest.
    - name: diagnose-fxcr-bf16
      id: fxcr-probe
      if: matrix.cpu == 'c906' || matrix.cpu == 'c910'
      continue-on-error: true
      run: |
        probe_dir=$(mktemp -d "$RUNNER_TEMP/fxcr-probe.XXXXXX")
        trap 'rm -rf "$probe_dir"' EXIT
        cxx=/data/action/osd/Xuantie-900-gcc-linux-6.6.36-glibc-x86_64-V3.4.0/bin/riscv64-unknown-linux-gnu-g++
        qemu=/data/action/osd/xuantie-qemu-x86_64-Ubuntu-20.04-V5.4.1/bin/qemu-riscv64
        "$cxx" --version
        "$qemu" --version
        cat > "$probe_dir/probe.cpp" <<'CPP'
        #include <stdint.h>
        #include <stdio.h>

        static unsigned long fxcr() { unsigned long x; asm volatile("csrr %0, 0x800" : "=r"(x) :: "memory"); return x; }
        static void set_fxcr(unsigned long x) { asm volatile("csrw 0x800, %0" :: "r"(x) : "memory"); }
        static unsigned long fcsr() { unsigned long x; asm volatile("csrr %0, fcsr" : "=r"(x) :: "memory"); return x; }

        // Exactly one lane; no ncnn, intrinsics, scalar float conversion, or auto-vectorization.
        __attribute__((noinline)) static uint32_t widen()
        {
            const uint16_t in = 0x3c00;
            uint32_t out;
            asm volatile("th.vsetvli zero, %2, e16, m1\n\t"
                         "th.vle.v v1, (%0)\n\t"
                         "th.vfwcvt.f.f.v v2, v1\n\t"
                         "th.vsetvli zero, %2, e32, m2\n\t"
                         "th.vse.v v2, (%1)"
                         :: "r"(&in), "r"(&out), "r"(1UL)
                         : "memory", "v1", "v2", "v3", "vl", "vtype");
            return out;
        }

        int main()
        {
            const unsigned long original = fxcr(), original_fcsr = fcsr();
            const unsigned long bf16 = 1UL << 31;
            set_fxcr(8); // Known BF16-off/RNE baseline, including a seeded exception flag.
            const unsigned long before = fxcr();
            const uint32_t fp16_before = widen();
            unsigned long saved;
            asm volatile("csrrs %0, 0x800, %1" : "=r"(saved) : "r"(bf16) : "memory");
            const unsigned long on = fxcr();
            const uint32_t bf16_on = widen();
            asm volatile("csrc 0x800, %0" :: "r"(bf16) : "memory");
            const unsigned long cleared = fxcr();
            const uint32_t fp16_after_clear = widen();
            set_fxcr(before);
            const unsigned long restored = fxcr();
            const uint32_t fp16_after_restore = widen();
            set_fxcr(original);
            asm volatile("csrw fcsr, %0" :: "r"(original_fcsr) : "memory");
            const unsigned long final_fxcr = fxcr(), final_fcsr = fcsr();

            printf("Expected input=0x3c00 FP16->FP32=0x3f800000 BF16->FP32=0x3c000000\n");
            printf("FXCR original=%016lx before=%016lx saved=%016lx on=%016lx masked_clear=%016lx full_restore=%016lx final=%016lx\n",
                   original, before, saved, on, cleared, restored, final_fxcr);
            printf("Widen before_enable=%08x enabled=%08x after_masked_clear=%08x after_full_restore=%08x\n",
                   fp16_before, bf16_on, fp16_after_clear, fp16_after_restore);
            printf("FCSR original=%08lx final=%08lx (includes FRM and flags)\n", original_fcsr, final_fcsr);
            const bool leak = (cleared & bf16) || fp16_after_clear == 0x3c000000;
            const bool failed = before != 8 || saved != before || on != (before | bf16) || cleared != before || restored != before ||
                                fp16_before != 0x3f800000 || bf16_on != 0x3c000000 || fp16_after_clear != 0x3f800000 ||
                                fp16_after_restore != 0x3f800000 || final_fxcr != original || final_fcsr != original_fcsr;
            printf("FXCR diagnosis=%s; exit=%d\n", leak ? "MASKED_CLEAR_LEAK" : failed ? "UNEXPECTED_RESULT" : "PASS", failed ? 1 : 0);
            return failed ? 1 : 0;
        }
        CPP
        "$cxx" -O2 -fno-tree-vectorize -march=rv64gc_zfh_xtheadvector_xtheadc -mabi=lp64d -mtune=${{ matrix.cpu }} -static "$probe_dir/probe.cpp" -o "$probe_dir/probe"
        "$qemu" -cpu ${{ matrix.QEMU_CPU }} "$probe_dir/probe"

    - name: build
      run: |
        export RISCV_ROOT_PATH=/data/action/osd/Xuantie-900-gcc-linux-6.6.36-glibc-x86_64-V3.4.0
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/${{ matrix.cpu }}-v310.toolchain.cmake -DCMAKE_BUILD_TYPE=release \
            -DNCNN_OPENMP=${{ matrix.OPENMP }} -DNCNN_THREADS=${{ matrix.OPENMP }} \
            -DNCNN_RUNTIME_CPU=OFF \
            -DNCNN_RVV=${{ matrix.RVV }} \
            -DNCNN_XTHEADVECTOR=${{ matrix.XTHEADVECTOR }} \
            -DNCNN_ZFH=${{ matrix.ZFH }} \
            -DNCNN_ZVFH=${{ matrix.ZVFH }} \
            -DNCNN_SIMPLEOCV=ON -DNCNN_BUILD_EXAMPLES=ON -DNCNN_BUILD_TESTS=ON ..
        cmake --build . -j 8

    - name: test
      run: |
        export PATH=/data/action/osd/xuantie-qemu-x86_64-Ubuntu-20.04-V5.4.1/bin:$PATH
        cd build
        TESTS_EXECUTABLE_LOADER=qemu-riscv64 TESTS_EXECUTABLE_LOADER_ARGUMENTS="-cpu;${{ matrix.QEMU_CPU }}" ctest --output-on-failure -j 8
        if [ "${{ steps.fxcr-probe.outcome }}" = failure ]; then
          echo "::error::FXCR diagnostic failed; see diagnose-fxcr-bf16 output above"
          exit 1
        fi

  spacemit:
    name: spacemit-${{ matrix.cpu }}
    runs-on: [self-hosted, linux, ubuntu]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cpu: x60, QEMU_CPU: "max,vlen=256,elen=64,vext_spec=v1.0", OPENMP: ON, RVV: ON, XTHEADVECTOR: OFF, ZFH: ON, ZVFH: ON }

    steps:
    - uses: actions/checkout@v7

    # https://archive.spacemit.com/toolchain/spacemit-toolchain-linux-glibc-x86_64-v1.2.4.tar.xz
    - name: build-gcc
      run: |
        export RISCV_ROOT_PATH=/data/action/osd/spacemit-toolchain-linux-glibc-x86_64-v1.2.4
        mkdir build-gcc && cd build-gcc
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/k1.toolchain.cmake -DCMAKE_BUILD_TYPE=release \
            -DNCNN_OPENMP=${{ matrix.OPENMP }} -DNCNN_THREADS=${{ matrix.OPENMP }} \
            -DNCNN_RUNTIME_CPU=OFF \
            -DNCNN_RVV=${{ matrix.RVV }} \
            -DNCNN_XTHEADVECTOR=${{ matrix.XTHEADVECTOR }} \
            -DNCNN_ZFH=${{ matrix.ZFH }} \
            -DNCNN_ZVFH=${{ matrix.ZVFH }} \
            -DNCNN_SIMPLEOCV=ON -DNCNN_BUILD_EXAMPLES=ON -DNCNN_BUILD_TESTS=ON ..
        cmake --build . -j 8

    - name: build-llvm
      run: |
        export RISCV_ROOT_PATH=/data/action/osd/spacemit-toolchain-linux-glibc-x86_64-v1.2.4
        mkdir build-llvm && cd build-llvm
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/k1.llvm.toolchain.cmake -DCMAKE_BUILD_TYPE=release \
            -DNCNN_OPENMP=${{ matrix.OPENMP }} -DNCNN_THREADS=${{ matrix.OPENMP }} \
            -DNCNN_RUNTIME_CPU=OFF \
            -DNCNN_RVV=${{ matrix.RVV }} \
            -DNCNN_XTHEADVECTOR=${{ matrix.XTHEADVECTOR }} \
            -DNCNN_ZFH=${{ matrix.ZFH }} \
            -DNCNN_ZVFH=${{ matrix.ZVFH }} \
            -DNCNN_SIMPLEOCV=ON -DNCNN_BUILD_EXAMPLES=ON -DNCNN_BUILD_TESTS=ON ..
        cmake --build . -j 8

    # https://archive.spacemit.com/spacemit-ai/qemu/jdsk-qemu-v10.0.2.tar.gz
    - name: test-gcc
      run: |
        export RISCV_ROOT_PATH=/data/action/osd/spacemit-toolchain-linux-glibc-x86_64-v1.2.4
        export PATH=/data/action/osd/jdsk-qemu/bin:$PATH
        cd build-gcc
        TESTS_EXECUTABLE_LOADER=qemu-riscv64 TESTS_EXECUTABLE_LOADER_ARGUMENTS="-cpu;${{ matrix.QEMU_CPU }};-L;${RISCV_ROOT_PATH}/sysroot" ctest --output-on-failure -j 8

    - name: test-llvm
      run: |
        export RISCV_ROOT_PATH=/data/action/osd/spacemit-toolchain-linux-glibc-x86_64-v1.2.4
        export PATH=/data/action/osd/jdsk-qemu/bin:$PATH
        cd build-llvm
        TESTS_EXECUTABLE_LOADER=qemu-riscv64 TESTS_EXECUTABLE_LOADER_ARGUMENTS="-cpu;${{ matrix.QEMU_CPU }};-L;${RISCV_ROOT_PATH}/sysroot" ctest --output-on-failure -j 8

