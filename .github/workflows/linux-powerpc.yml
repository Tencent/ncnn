name: linux-powerpc
on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/linux-powerpc.yml'
    - 'toolchains/powerpc-linux-gnu.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/powerpc/**'
    - 'tests/**'
  pull_request:
    branches: [master]
    paths:
    - '.github/workflows/linux-powerpc.yml'
    - 'toolchains/powerpc-linux-gnu.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/powerpc/**'
    - 'tests/**'
concurrency:
  group: linux-powerpc-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  powerpc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: powerpc-gnu-toolchain
      run: |
        sudo apt-get update
        sudo apt-get install g++-powerpc-linux-gnu qemu-user

    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/powerpc-linux-gnu.toolchain.cmake -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_TESTS=ON ..
        cmake --build . -j $(nproc)

    - name: test
      run: |
        cd build
        TESTS_EXECUTABLE_LOADER=qemu-ppc TESTS_EXECUTABLE_LOADER_ARGUMENTS="-L;/usr/powerpc-linux-gnu;-cpu;g4" ctest --output-on-failure -j $(nproc)
