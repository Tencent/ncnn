name: linux-mips64
on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/linux-mips64.yml'
    - 'toolchains/mips64el-linux-gnuabi64.toolchain.cmake'
    - 'toolchains/mipsisa64r6el-linux-gnuabi64.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/mips/**'
    - 'tests/**'
  pull_request:
    branches: [master]
    paths:
    - '.github/workflows/linux-mips64.yml'
    - 'toolchains/mips64el-linux-gnuabi64.toolchain.cmake'
    - 'toolchains/mipsisa64r6el-linux-gnuabi64.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/mips/**'
    - 'tests/**'
concurrency:
  group: linux-mips64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  mips64el:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: mips64el-gnuabi64-toolchain
      run: |
        . /etc/os-release
        if [ "$VERSION_CODENAME" != noble ]; then
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list.d/noble-mips.list
          printf 'Package: *mips*\nPin: release n=noble\nPin-Priority: 100\n\nPackage: *\nPin: release n=noble\nPin-Priority: -1\n' | sudo tee /etc/apt/preferences.d/noble-mips
        fi
        sudo apt-get update
        sudo apt-get install g++-mips64el-linux-gnuabi64 qemu-user

    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/mips64el-linux-gnuabi64.toolchain.cmake -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_TESTS=ON ..
        cmake --build . -j $(nproc)

    - name: test
      run: |
        cd build
        TESTS_EXECUTABLE_LOADER=qemu-mips64el TESTS_EXECUTABLE_LOADER_ARGUMENTS="-L;/usr/mips64el-linux-gnuabi64" ctest --output-on-failure -j $(nproc)

  mipsisa64r6el:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: mipsisa64r6el-gnuabi64-toolchain
      run: |
        . /etc/os-release
        if [ "$VERSION_CODENAME" != noble ]; then
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list.d/noble-mips.list
          printf 'Package: *mips*\nPin: release n=noble\nPin-Priority: 100\n\nPackage: *\nPin: release n=noble\nPin-Priority: -1\n' | sudo tee /etc/apt/preferences.d/noble-mips
        fi
        sudo apt-get update
        sudo apt-get install g++-mipsisa64r6el-linux-gnuabi64 qemu-user

    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/mipsisa64r6el-linux-gnuabi64.toolchain.cmake -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_TESTS=ON ..
        cmake --build . -j $(nproc)

    - name: test
      run: |
        cd build
        TESTS_EXECUTABLE_LOADER=qemu-mips64el TESTS_EXECUTABLE_LOADER_ARGUMENTS="-L;/usr/mipsisa64r6el-linux-gnuabi64" ctest --output-on-failure -j $(nproc)
